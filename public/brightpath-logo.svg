<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Sunburst arc above the "b" — 15 graduated dashes, navy → light blue -->
  <g transform="translate(28, 34)">
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#0d1b2a" stroke-width="2.2" stroke-linecap="round" transform="rotate(-85)"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#0d1b2a" stroke-width="2.2" stroke-linecap="round" transform="rotate(-73)"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#132d4a" stroke-width="2.2" stroke-linecap="round" transform="rotate(-61)"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#1e4470" stroke-width="2.2" stroke-linecap="round" transform="rotate(-49)"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#2a5b96" stroke-width="2.2" stroke-linecap="round" transform="rotate(-37)"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#3672b0" stroke-width="2.2" stroke-linecap="round" transform="rotate(-25)"/>
    <line x1="0" y1="0" x2="0" y2="-17" stroke="#4688c4" stroke-width="2.3" stroke-linecap="round" transform="rotate(-13)"/>
    <line x1="0" y1="0" x2="0" y2="-17" stroke="#569dd4" stroke-width="2.3" stroke-linecap="round" transform="rotate(0)"/>
    <line x1="0" y1="0" x2="0" y2="-17" stroke="#62aade" stroke-width="2.3" stroke-linecap="round" transform="rotate(13)"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#6bb1e4" stroke-width="2.3" stroke-linecap="round" transform="rotate(25)"/>
    <line x1="0" y1="0" x2="0" y2="-16" stroke="#72b4e6" stroke-width="2.2" stroke-linecap="round" transform="rotate(37)"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#77b6e8" stroke-width="2.2" stroke-linecap="round" transform="rotate(49)"/>
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#77b6e8" stroke-width="2.2" stroke-linecap="round" transform="rotate(61)"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#77b6e8" stroke-width="2" stroke-linecap="round" transform="rotate(73)"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#77b6e8" stroke-width="2" stroke-linecap="round" transform="rotate(85)"/>
