  <!-- "bright" -->
  <text x="18" y="58" font-family="'Inter',system-ui,sans-serif" font-size="36" font-weight="700" fill="#0d1b2a" letter-spacing="-0.5">bright</text>
  <!-- "path" -->
  <text x="130" y="58" font-family="'Inter',system-ui,sans-serif" font-size="36" font-weight="700" fill="#77b6e8" letter-spacing="-0.5">path</text>
  <!-- divider + Finance -->
  <line x1="52" y1="68" x2="100" y2="68" stroke="#d9d9d9" stroke-width="1"/>
  <text x="104" y="72" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="400" fill="#999" letter-spacing="2.5">Finance</text>
  <line x1="178" y1="68" x2="226" y2="68" stroke="#d9d9d9" stroke-width="1"/>
