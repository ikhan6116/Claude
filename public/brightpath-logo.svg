<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 95" fill="none">
  <!-- Sunburst arc — tick marks along a semicircle above "b", navy → light blue -->
  <g transform="translate(32, 40)">
    <line x1="0" y1="-22" x2="0" y2="-32" stroke="#0d1b2a" stroke-width="2.8" stroke-linecap="round" transform="rotate(-82)"/>
    <line x1="0" y1="-22" x2="0" y2="-31" stroke="#0d1b2a" stroke-width="2.8" stroke-linecap="round" transform="rotate(-70)"/>
    <line x1="0" y1="-21" x2="0" y2="-30" stroke="#102a45" stroke-width="2.6" stroke-linecap="round" transform="rotate(-58)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#183d60" stroke-width="2.5" stroke-linecap="round" transform="rotate(-46)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#24507a" stroke-width="2.5" stroke-linecap="round" transform="rotate(-34)"/>
    <line x1="0" y1="-19" x2="0" y2="-28" stroke="#316494" stroke-width="2.5" stroke-linecap="round" transform="rotate(-22)"/>
    <line x1="0" y1="-19" x2="0" y2="-29" stroke="#3f78ae" stroke-width="2.6" stroke-linecap="round" transform="rotate(-10)"/>
    <line x1="0" y1="-19" x2="0" y2="-30" stroke="#4d8cc2" stroke-width="2.8" stroke-linecap="round" transform="rotate(2)"/>
    <line x1="0" y1="-19" x2="0" y2="-29" stroke="#5a9ad0" stroke-width="2.6" stroke-linecap="round" transform="rotate(14)"/>
    <line x1="0" y1="-19" x2="0" y2="-28" stroke="#64a5d8" stroke-width="2.5" stroke-linecap="round" transform="rotate(26)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#6bade0" stroke-width="2.5" stroke-linecap="round" transform="rotate(38)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#71b2e4" stroke-width="2.5" stroke-linecap="round" transform="rotate(50)"/>
    <line x1="0" y1="-21" x2="0" y2="-30" stroke="#74b4e6" stroke-width="2.6" stroke-linecap="round" transform="rotate(62)"/>
    <line x1="0" y1="-22" x2="0" y2="-31" stroke="#77b6e8" stroke-width="2.8" stroke-linecap="round" transform="rotate(74)"/>
    <line x1="0" y1="-22" x2="0" y2="-32" stroke="#77b6e8" stroke-width="2.8" stroke-linecap="round" transform="rotate(86)"/>
  </g>
  <!-- "brightpath" as one word, two-tone -->
  <text x="10" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#0d1b2a">bright</tspan><tspan fill="#77b6e8">path</tspan>
  </text>
  <!-- divider lines + Finance — lowered for spacing -->
  <line x1="60" y1="82" x2="112" y2="82" stroke="#d9d9d9" stroke-width="1"/>
  <text x="117" y="86" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#999" letter-spacing="2">Finance</text>
  <line x1="192" y1="82" x2="244" y2="82" stroke="#d9d9d9" stroke-width="1"/>
</svg>
