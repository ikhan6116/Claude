    <line x1="0" y1="-19" x2="0" y2="-28" stroke="#bde1fa" stroke-width="2.5" stroke-linecap="round" transform="rotate(26)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#c5e5fb" stroke-width="2.5" stroke-linecap="round" transform="rotate(38)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#cde9fc" stroke-width="2.5" stroke-linecap="round" transform="rotate(50)"/>
