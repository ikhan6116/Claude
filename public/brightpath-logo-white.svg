  <!-- "bright" in white -->
  <text x="10" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">bright</text>
  <!-- "path" in light blue -->
  <text x="136" y="62" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" fill="#77b6e8" letter-spacing="-0.5">path</text>
