  <text x="117" y="77" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="2">Finance</text>
  <line x1="192" y1="73" x2="244" y2="73" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
