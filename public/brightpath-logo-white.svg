    <line x1="0" y1="-22" x2="0" y2="-31" stroke="#6094bf" stroke-width="2.8" stroke-linecap="round" transform="rotate(-70)"/>
    <line x1="0" y1="-21" x2="0" y2="-30" stroke="#669ec9" stroke-width="2.6" stroke-linecap="round" transform="rotate(-58)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#6da8d3" stroke-width="2.5" stroke-linecap="round" transform="rotate(-46)"/>
    <line x1="0" y1="-20" x2="0" y2="-29" stroke="#77b6e8" stroke-width="2.5" stroke-linecap="round" transform="rotate(-34)"/>
    <line x1="0" y1="-19" x2="0" y2="-28" stroke="#85bfec" stroke-width="2.5" stroke-linecap="round" transform="rotate(-22)"/>
    <line x1="0" y1="-19" x2="0" y2="-29" stroke="#93c8f0" stroke-width="2.6" stroke-linecap="round" transform="rotate(-10)"/>
